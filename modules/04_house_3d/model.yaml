provenance:
  policy: >
    Wartości project pochodzą z dokumentacji wskazanej w notatkach, measured/as_built
    z informacji o stanie wykonanym, a derived są obliczeniami opisanymi w notatkach.
  records:
    finished_floor_level_mm:
      type: project
      source: "Projekt budowlany PZT_PAB_2024.02.01.pdf, przekroje A-A/B-B"
    floor_thickness_mm:
      type: measured
      source: "stan wykonany przekazany przez inwestora"
    garage_floor_offset_mm:
      type: derived
      source: "13 vs 12 warstw pustaka; wall_top_mm / 13"
    entrance_landing.top_z_mm:
      type: measured
      source: "stan wykonany inwestora; kontrola PZT 254,00 / 253,70 m"
    entrance_canopy:
      type: derived
      source: "daszek.jpg + geometria wejścia"

