schema_version: 1
status: manufacturer_technical_catalog
provenance:
  type: project_market_survey
  date: '2026-10-05'
  description: >
    Zestawienie parametrów technicznych i formatów płytek ceramicznych i spieków
    w stylu Calacatta (białe/jasne tło z ciemnym/czarnym oraz czarno-złotym użyleniem)
    od 6 polskich producentów: Tubądzin, Paradyż, Opoczno, Cerrad, Ceramica Limone, Cersanit.
evaluated_formats_mm:
  standard: [1200, 600]
  square: [1200, 1200]
  grand_slab: [1200, 2800] # tubądzin: 1200x2750; paradyż/cerrad: 1200x2800

manufacturers:
  tubadzin:
    name: Grupa Tubądzin
    website: https://www.tubadzin.pl/
    brand_lines: [Tubądzin, Monolith, Korzilius, Tubądzin kreacja Maciej Zień]
    architect_portal: https://www.tubadzin.pl/ oraz Tubądzin Design Community (tubadzincommunity.com)
    collections:
      marmo_d_oro:
        name: Marmo d'Oro (Monolith)
        style: Calacatta Kintsugi (biel ze szlachetnym ciemnoszarym i złotym użyleniem)
        designers: TU_kolektyw (Maria Marczewska, Tomasz Smus)
        body_type: Gres porcelanowy barwiony w masie
        rectified: true
        frost_resistant: true
        water_absorption: Eb <= 0.5% (Grupa BIa)
        slip_resistance: R9 (wersja mat)
        abrasion_class: PEI IV / PEI V
        stain_resistance: Klasa 5
        surfaces: [MAT (matowa/satynowa), POL (polerowana)]
        formats:
          - nominal_cm: '120x275'
            actual_mm: [1198, 2748]
            thickness_mm: 6.0
            category: Płyta wielkoformatowa (Monolith Slab)
            weight_kg_sqm: 15.5
          - nominal_cm: '120x120'
            actual_mm: [1198, 1198]
            thickness_mm: 6.0
            category: Gres wielkoformatowy
          - nominal_cm: '120x60'
            actual_mm: [1198, 598]
            thickness_mm: 8.0
            category: Gres ścienno-podłogowy
          - nominal_cm: '80x80'
            actual_mm: [798, 798]
            thickness_mm: 8.0
            category: Gres kwadratowy
      pietrasanta:
        name: Pietrasanta (Monolith)
        style: Calacatta Classico (śnieżna biel z wyrazistym, głębokim szaro-grafitowym użyleniem)
        body_type: Gres barwiony w masie
        rectified: true
        frost_resistant: true
        slip_resistance: R9 (mat)
        surfaces: [MAT, POL]
        formats:
          - nominal_cm: '120x275'
            actual_mm: [1198, 2748]
            thickness_mm: 6.0
            category: Monolith Slab
          - nominal_cm: '120x120'
            actual_mm: [1198, 1198]
