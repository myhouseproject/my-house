  note: >
    Układ dopasowany do istniejących R02/R03 i otwartego przejścia PR01 według zdjęć referencyjnych 01–05.
    Kolorystyka z nowych zdjęć palette-01/02: jasny ciepły szary beton bez marmurowych żył, naturalny brąz dębu,
    chromowana armatura i przezroczyste szkło. Zachowano bryły, lamele i okrągłe lustro poprzedniego układu.
    W strefie prysznica wykończenie drewnopodobne zamiast betonu, na niezmienionym poziomie gotowej posadzki Z=0.
    Gabaryty wyposażenia są założeniami, nie wymiarami produktów. Nie wprowadzono widocznych urządzeń
    pralniczych, ponieważ zdjęcia ich nie pokazują.
