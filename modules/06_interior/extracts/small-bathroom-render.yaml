marble_shaders:
  small_bathroom_gray_stone:
    # A constant vein ramp disables the marble bands. Full cloud blending gives
    # matte, softly mottled concrete while preserving the shared shader recipe.
    coordinate_scale: [1, 1, 1]
    cloud_scale: 5
    cloud_detail: 6
    cloud_roughness: 0.72
    cloud_color_dark_srgb: [0.60, 0.59, 0.56]
    cloud_color_light_srgb: [0.84, 0.83, 0.80]
    cloud_blend: 1
    wave_scale: 0.46
    wave_distortion: 3.5
    wave_detail: 5
    wave_detail_scale: 1.8
    wave_detail_roughness: 0.7
    vein_ramp:
      - [0.00, [1, 1, 1]]
      - [1.00, [1, 1, 1]]
    micro_scale: 260
    bump_strength: 0.12
    bump_distance_mm: 0.10
wood_shaders:
  small_bathroom_vertical_oak:
    coordinate_scale: [8, 8, 0.18]
    grain_scale: 4
    grain_detail: 3
    grain_roughness: 0.6
    color_dark_srgb: [0.20, 0.15, 0.10]
    color_light_srgb: [0.40, 0.32, 0.235]
    bump_strength: 0.12
    bump_distance_mm: 0.12
  small_bathroom_horizontal_oak:
