schema_version: 1
status: conceptual_material_study_not_product_selection
provenance:
  type: assumed
  source_id: small-bathroom-palette-01
  source_ids: [small-bathroom-palette-01, small-bathroom-palette-02]
  note: >
    Render rzeczywistej geometrii R03 i R02. Jasny ciepłoszary beton bez żył,
    ciemniejszy naturalny dąb i chrom według nowych referencji kolorystycznych.
    Układ i kształty wyposażenia pozostają według wcześniejszych zdjęć łazienki
    oraz pralni. Materiały proceduralne nie wskazują produktu.
    Moce oświetlenia, optyka i kadry są założeniami wizualizacji.
