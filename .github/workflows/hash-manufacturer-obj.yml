name: Hash manufacturer OBJ
on:
  push:
    branches:
      - feature/manufacturer-obj-bathroom
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash exact assets
        run: |
          sha256sum assets/models/cersanit/S301-372/S301-372.obj
          sha256sum assets/models/omnires/Y1233BSB/Y1233BSB.obj
