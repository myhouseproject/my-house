name: Finalize bathroom manufacturer OBJ

on:
  push:
    branches: ['feature/manufacturer-obj-bathroom']

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manufacturer-obj-bathroom
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical mesh stack
        run: python -m pip install -r requirements.txt
      - name: Finalize exact asset declarations
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import trimesh

          cersanit = Path('assets/models/cersanit/S301-372/S301-372.obj')
          y1233 = Path('assets/models/omnires/Y1233BSB/Y1233BSB.obj')
          for p in (cersanit, y1233):
              scene = trimesh.load(p, force='scene', process=False)
              mesh = scene.to_geometry()
              assert len(mesh.vertices) and len(mesh.faces), p
              print(p, 'sha256=', hashlib.sha256(p.read_bytes()).hexdigest(),
                    'vertices=', len(mesh.vertices), 'faces=', len(mesh.faces),
                    'extents=', mesh.extents.tolist())

          y1233_sha = hashlib.sha256(y1233.read_bytes()).hexdigest()
          cersanit_sha = hashlib.sha256(cersanit.read_bytes()).hexdigest()

          bathroom = Path('modules/06_interior/extracts/bathroom.yaml')
          text = bathroom.read_text(encoding='utf-8').replace(
              'assets/models/omnires/Y1233BSB/Y1233-SBSB_1.obj',
              'assets/models/omnires/Y1233BSB/Y1233BSB.obj'
          )
          bathroom.write_text(text, encoding='utf-8')

          manifest = Path('sources/manifest.yaml')
          text = manifest.read_text(encoding='utf-8')
          old = '''  omnires-y1233bsb-obj:
    kind: file
    availability: repository
    path: assets/models/omnires/Y1233BSB/Y1233-SBSB_1.obj
    sha256: 41562c885feb96bf0ce7a241a3593993a46085d30b333d63a196a49b3815e034
    status: ordered
    note: Zastany plik OBJ w pakiecie OMNIRES przypisanym do Y1233BSB; przed scaleniem musi zostać zweryfikowany względem aktualnego pliku produktu Y1233BSB 1120 mm.
'''
          new = f'''  omnires-y1233bsb-obj:
    kind: file
    availability: repository
    path: assets/models/omnires/Y1233BSB/Y1233BSB.obj
    sha256: {y1233_sha}
    status: ordered
    note: Oficjalny model OBJ produktu OMNIRES Y1233BSB pobrany z plików 3D produktu; używany bez upraszczania siatki jako geometria baterii wannowej R07.
'''
          if old not in text:
              raise SystemExit('expected old Y1233 manifest block not found')
          text = text.replace(old, new, 1)
          if '  cersanit-s301-372-obj:' not in text:
              anchor = '  geodesy-notes:\n'
              block = f'''  cersanit-s301-372-obj:
    kind: file
    availability: repository
    path: assets/models/cersanit/S301-372/S301-372.obj
    sha256: {cersanit_sha}
    status: ordered
    note: Oficjalny model OBJ wanny Cersanit INVERTO SPA 180x80 S301-372; używany bez upraszczania siatki jako widoczna geometria wanny R07.
'''
              if anchor not in text:
                  raise SystemExit('manifest insertion anchor not found')
              text = text.replace(anchor, block + anchor, 1)
          manifest.write_text(text, encoding='utf-8')
          PY
      - name: Run project validation and bathroom geometry tests
        run: |
          python scripts/project.py validate
          python -m unittest tests.test_bathroom_geometry
      - name: Commit finalized declarations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/06_interior/extracts/bathroom.yaml sources/manifest.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize exact manufacturer OBJ references'
          git push origin HEAD:feature/manufacturer-obj-bathroom
