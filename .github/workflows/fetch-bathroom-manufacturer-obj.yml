name: Fetch bathroom manufacturer OBJ

on:
  push:
    branches: ['feature/manufacturer-obj-bathroom']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manufacturer-obj-bathroom
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mesh stack
        run: python -m pip install -r requirements.txt
      - name: Inspect official Omnires OBJ assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          import numpy as np
          import trimesh

          models = {
              'OMNIRES_Y1233BSB': Path('assets/models/omnires/Y1233BSB/Y1233-SBSB_1.obj'),
              'OMNIRES_Y1212BSB': Path('assets/models/omnires/Y1212BSB/Y1212BSB.obj'),
              'OMNIRES_Y1244SUBSB': Path('assets/models/omnires/Y1244SUBSB/Y1244SUBSB_1.obj'),
              'OMNIRES_SYSYBI2BSB': Path('assets/models/omnires/SYSYBI2BSB/SYSYBI2BSB.obj'),
          }
          report = {}
          for key, path in models.items():
              payload = path.read_bytes()
              loaded = trimesh.load(path, force='scene', process=False)
              mesh = loaded.to_geometry()
              bounds = np.asarray(mesh.bounds, dtype=float)
              report[key] = {
                  'path': path.as_posix(),
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'size_bytes': len(payload),
                  'vertices': int(sum(len(g.vertices) for g in loaded.geometry.values())),
                  'faces': int(sum(len(g.faces) for g in loaded.geometry.values())),
                  'bounds_source_units': bounds.tolist(),
                  'extents_source_units': (bounds[1] - bounds[0]).tolist(),
                  'centroid_source_units': np.asarray(mesh.centroid, dtype=float).tolist(),
                  'watertight_all_parts': bool(all(g.is_watertight for g in loaded.geometry.values())),
                  'geometry_parts': len(loaded.geometry),
              }
          Path('assets/models/manufacturer-model-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2))
          PY
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch official Cersanit Inverto OBJ through product page
        run: |
          mkdir -p assets/models/cersanit/S301-372
          cat > /tmp/fetch-cersanit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const productUrl = 'https://www.cersanit.com.pl/lazienka/wanna-wolnostojaca-owalna-inverto-by-cersanit-spa-180x80,2270.html';
          const output = 'assets/models/cersanit/S301-372/S301-372.obj';
          const browser = await chromium.launch({headless: true});
          const context = await browser.newContext({
            acceptDownloads: true,
            locale: 'pl-PL',
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
          });
          const page = await context.newPage();
          await page.goto(productUrl, {waitUntil: 'domcontentloaded', timeout: 90000});
          await page.waitForTimeout(4000);
          const objUrl = await page.locator('a').evaluateAll((links) => {
            const hit = links.find((a) => /\.obj(?:$|\?)/i.test(a.href) || /plik obj/i.test((a.textContent || '').trim()));
            return hit?.href || null;
          });
          if (!objUrl) {
            throw new Error('Official OBJ link not found on Cersanit product page');
          }
          console.log('Cersanit OBJ:', objUrl);

          let saved = false;
          const response = await context.request.get(objUrl, {
            headers: { Referer: productUrl, Accept: 'text/plain,application/octet-stream;q=0.9,*/*;q=0.8' },
            timeout: 90000
          });
          if (response.ok()) {
            fs.writeFileSync(output, await response.body());
            saved = true;
          } else {
            console.log('API request status:', response.status());
          }

          if (!saved) {
            const locator = page.locator('a').filter({hasText: /Plik OBJ/i}).first();
            const downloadPromise = page.waitForEvent('download', {timeout: 90000});
            await locator.click();
            const download = await downloadPromise;
            await download.saveAs(output);
          }
          await browser.close();
          const stat = fs.statSync(output);
          if (stat.size < 10000) throw new Error('Downloaded OBJ is unexpectedly small');
          console.log('Saved bytes:', stat.size);
          JS
          node /tmp/fetch-cersanit.mjs
      - name: Extend report with Cersanit OBJ
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          import numpy as np
          import trimesh

          path = Path('assets/models/cersanit/S301-372/S301-372.obj')
          payload = path.read_bytes()
          loaded = trimesh.load(path, force='scene', process=False)
          mesh = loaded.to_geometry()
          bounds = np.asarray(mesh.bounds, dtype=float)
          report_path = Path('assets/models/manufacturer-model-report.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report['CERSANIT_S301_372'] = {
              'path': path.as_posix(),
              'sha256': hashlib.sha256(payload).hexdigest(),
              'size_bytes': len(payload),
              'vertices': int(sum(len(g.vertices) for g in loaded.geometry.values())),
              'faces': int(sum(len(g.faces) for g in loaded.geometry.values())),
              'bounds_source_units': bounds.tolist(),
              'extents_source_units': (bounds[1] - bounds[0]).tolist(),
              'centroid_source_units': np.asarray(mesh.centroid, dtype=float).tolist(),
              'watertight_all_parts': bool(all(g.is_watertight for g in loaded.geometry.values())),
              'geometry_parts': len(loaded.geometry),
          }
          report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report['CERSANIT_S301_372'], indent=2))
          PY
      - name: Commit manufacturer asset and report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/cersanit/S301-372/S301-372.obj assets/models/manufacturer-model-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add official Cersanit Inverto OBJ and geometry report'
          git push origin HEAD:feature/manufacturer-obj-bathroom
