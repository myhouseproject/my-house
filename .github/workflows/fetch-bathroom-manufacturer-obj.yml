name: Diagnose Cersanit asset endpoint

on:
  push:
    branches: ['feature/manufacturer-obj-bathroom']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Cersanit download endpoint
        run: |
          set -u
          URL='https://www.cersanit.com/download/gfx/opoczno/en/produktyoferta3d/2172/obj_s301-372_inverto_spa_180x80_bathtub_freestanding.obj'
          echo '=== DNS ==='
          getent ahosts www.cersanit.com || true
          command -v dig >/dev/null && dig www.cersanit.com CNAME +short || true
          echo '=== HEADERS ==='
          curl -sS -D /tmp/headers.txt -o /tmp/body.html \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36' \
            -e 'https://www.cersanit.com/bathroom/inverto-by-cersanit-spa-180x80-oval-freestanding-bathtub,2172.html' \
            "$URL" || true
          cat /tmp/headers.txt
          echo '=== BODY HEAD ==='
          head -c 3000 /tmp/body.html || true
          echo
