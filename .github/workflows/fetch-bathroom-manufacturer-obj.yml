name: Fetch bathroom manufacturer OBJ

on:
  push:
    branches: ['feature/manufacturer-obj-bathroom']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manufacturer-obj-bathroom
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install mesh stack
        run: python -m pip install -r requirements.txt

      - name: Fetch exact Omnires Y1233BSB OBJ
        run: |
          set -euo pipefail
          mkdir -p .tmp/y1233/unpacked assets/models/omnires/Y1233BSB
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            'https://omnires.com/pl/produkt/bateria-wannowa-wolnostojaca-y1233bsb/3d' \
            -o .tmp/y1233/Y1233BSB-product.zip
          unzip -o .tmp/y1233/Y1233BSB-product.zip -d .tmp/y1233/unpacked
          candidate="$(find .tmp/y1233/unpacked -type f -iname 'Y1233BSB.obj' | head -n 1)"
          test -n "$candidate"
          cp "$candidate" assets/models/omnires/Y1233BSB/Y1233BSB.obj

      - name: Fetch exact Cersanit S301-372 OBJ through Tor
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor netcat-openbsd
          mkdir -p assets/models/cersanit/S301-372
          TARGETS=(
            'https://www.cersanit.com/download/gfx/opoczno/en/produktyoferta3d/2172/obj_s301-372_inverto_spa_180x80_bathtub_freestanding.obj'
            'https://www.cersanit.com.pl/download/gfx/opoczno/pl/produktyoferta3d/2270/obj_s301-372_inverto_spa_180x80_bathtub_freestanding.obj'
          )
          PRODUCT_REFERERS=(
            'https://www.cersanit.com/bathroom/inverto-by-cersanit-spa-180x80-oval-freestanding-bathtub,2172.html'
            'https://www.cersanit.com.pl/lazienka/wanna-wolnostojaca-owalna-inverto-by-cersanit-spa-180x80,2270.html'
          )
          success=0
          for attempt in 1 2 3 4 5 6; do
            sudo pkill tor || true
            sudo rm -rf /tmp/cersanit-tor
            sudo mkdir -p /tmp/cersanit-tor
            sudo chown "$(id -u):$(id -g)" /tmp/cersanit-tor
            tor --SocksPort 9050 --DataDirectory /tmp/cersanit-tor --Log 'notice stdout' > /tmp/tor.log 2>&1 &
            tor_pid=$!
            if ! timeout 60 bash -c 'until nc -z 127.0.0.1 9050; do sleep 1; done'; then
              cat /tmp/tor.log
              kill "$tor_pid" || true
              continue
            fi
            sleep 8
            for idx in 0 1; do
              rm -f /tmp/cersanit.obj
              status="$(curl --socks5-hostname 127.0.0.1:9050 \
                -L --connect-timeout 30 --max-time 120 \
                -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36' \
                -e "${PRODUCT_REFERERS[$idx]}" \
                -H 'Accept: text/plain,application/octet-stream;q=0.9,*/*;q=0.8' \
                -sS -o /tmp/cersanit.obj -w '%{http_code}' "${TARGETS[$idx]}" || true)"
              echo "attempt=$attempt target=$idx status=$status bytes=$(wc -c </tmp/cersanit.obj 2>/dev/null || echo 0)"
              if [ "$status" = "200" ] && [ -s /tmp/cersanit.obj ] \
                 && grep -q '^v ' /tmp/cersanit.obj && grep -q '^f ' /tmp/cersanit.obj; then
                cp /tmp/cersanit.obj assets/models/cersanit/S301-372/S301-372.obj
                success=1
                break
              fi
            done
            kill "$tor_pid" || true
            wait "$tor_pid" 2>/dev/null || true
            if [ "$success" -eq 1 ]; then break; fi
          done
          if [ "$success" -ne 1 ]; then
            echo "Could not fetch official Cersanit OBJ through six Tor exits"
            exit 1
          fi

      - name: Verify manufacturer meshes and write report
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          import numpy as np
          import trimesh

          models = {
              'CERSANIT_S301_372': Path('assets/models/cersanit/S301-372/S301-372.obj'),
              'OMNIRES_Y1233BSB': Path('assets/models/omnires/Y1233BSB/Y1233BSB.obj'),
              'OMNIRES_Y1212BSB': Path('assets/models/omnires/Y1212BSB/Y1212BSB.obj'),
              'OMNIRES_Y1244SUBSB': Path('assets/models/omnires/Y1244SUBSB/Y1244SUBSB_1.obj'),
              'OMNIRES_SYSYBI2BSB': Path('assets/models/omnires/SYSYBI2BSB/SYSYBI2BSB.obj'),
          }
          report = {}
          for key, path in models.items():
              payload = path.read_bytes()
              loaded = trimesh.load(path, force='scene', process=False)
              mesh = loaded.to_geometry()
              bounds = np.asarray(mesh.bounds, dtype=float)
              extents = bounds[1] - bounds[0]
              report[key] = {
                  'path': path.as_posix(),
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'size_bytes': len(payload),
                  'vertices': int(sum(len(g.vertices) for g in loaded.geometry.values())),
                  'faces': int(sum(len(g.faces) for g in loaded.geometry.values())),
                  'bounds_source_units': bounds.tolist(),
                  'extents_source_units': extents.tolist(),
                  'watertight_all_parts': bool(all(g.is_watertight for g in loaded.geometry.values())),
                  'geometry_parts': len(loaded.geometry),
              }
              print(key, report[key])

          y1233 = np.asarray(report['OMNIRES_Y1233BSB']['extents_source_units'])
          if not 108 <= y1233.max() <= 116:
              raise SystemExit(f'Wrong Y1233BSB asset: max source extent {y1233.max()}')

          tub = np.sort(np.asarray(report['CERSANIT_S301_372']['extents_source_units']))
          # Accept either mm or cm source units but verify the same 1800x800x640 product.
          expected_mm = np.sort(np.array([1800., 800., 640.]))
          ratios = [tub / expected_mm, tub * 10 / expected_mm]
          if min(np.max(np.abs(r - 1)) for r in ratios) > 0.04:
              raise SystemExit(f'Unexpected Cersanit S301-372 extents: {tub.tolist()}')

          Path('assets/models/manufacturer-model-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit exact manufacturer assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/models/cersanit/S301-372/S301-372.obj \
            assets/models/omnires/Y1233BSB/Y1233BSB.obj \
            assets/models/manufacturer-model-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add exact Cersanit and Omnires manufacturer OBJ assets'
          git push origin HEAD:feature/manufacturer-obj-bathroom
