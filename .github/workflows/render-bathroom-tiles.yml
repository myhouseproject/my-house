name: Porównanie płytek łazienki R07

on:
  push:
    branches: [feat/bathroom-correct-tile-comparison]
  workflow_dispatch:

concurrency:
  group: bathroom-tile-comparison-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate and test interior model
        run: python scripts/build.py --scope interior --test

  render:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tile_variant:
          - rak_calacatta_macchia_vecchia
          - cerrad_calacatta_gold
          - opoczno_calacatta_paonazzo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install model dependencies
        run: |
          python -m venv ../model-venv
          ../model-venv/bin/python -m pip install -r requirements.txt
      - name: Build canonical R07 geometry
        run: ../model-venv/bin/python scripts/build.py --scope interior
      - name: Download official texture pack and build tile atlas
        run: ../model-venv/bin/python scripts/prepare_tile_texture.py --variant "${{ matrix.tile_variant }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender/Cycles renderer
        run: |
          python -m venv ../render-venv
          ../render-venv/bin/python -m pip install -r requirements_render.txt
      - name: Render HQ from the canonical bathroom entrance camera
        run: |
          ../render-venv/bin/python scripts/render_bathroom.py \
            --scene build/current/scena_lokalna.json \
            --camera entrance \
            --quality final \
            --tile-variant "${{ matrix.tile_variant }}" \
            --output "build/renders/${{ matrix.tile_variant }}"
          cp build/render-textures/bathroom-tile-atlas.json "build/renders/${{ matrix.tile_variant }}/tile-texture.json"
      - name: Upload HQ PNG, Blender scene and provenance
        uses: actions/upload-artifact@v4
        with:
          name: bathroom-R07-${{ matrix.tile_variant }}
          path: build/renders/${{ matrix.tile_variant }}/
          if-no-files-found: error
          retention-days: 14
