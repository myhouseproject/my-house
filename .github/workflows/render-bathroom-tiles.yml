    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install model dependencies
        run: |
          python -m venv ../model-venv
          ../model-venv/bin/python -m pip install -r requirements.txt
      - name: Build canonical R07 geometry
        run: ../model-venv/bin/python scripts/build.py --scope interior --tile-format "${{ matrix.tile_format }}"
      - name: Download prepared tile texture atlases
        uses: actions/download-artifact@v4
        with:
          name: bathroom-tile-atlases
          path: build/render-textures/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender/Cycles renderer
        run: |
          python -m venv ../render-venv
          ../render-venv/bin/python -m pip install -r requirements_render.txt
      - name: Render bathroom views
        run: |
          QUALITY="${{ inputs.quality || 'final' }}"
          CAM="${{ inputs.camera || 'both' }}"
          OUT_DIR="build/renders/${{ matrix.job_id }}"
          mkdir -p "$OUT_DIR"
          
          if [ "$CAM" = "both" ] || [ "$CAM" = "entrance" ]; then
            echo "Rendering entrance camera..."
            ../render-venv/bin/python scripts/render_bathroom.py \
              --scene build/current/scena_lokalna.json \
              --camera entrance \
              --quality "$QUALITY" \
              --tile-variant "${{ matrix.tile_variant }}" \
              --tile-format "${{ matrix.tile_format }}" \
              --output "$OUT_DIR/entrance"
            cp "$OUT_DIR/entrance"/*.png "$OUT_DIR/${{ matrix.job_id }}_entrance.png" || true
          fi
          
          if [ "$CAM" = "both" ] || [ "$CAM" = "reverse" ]; then
            echo "Rendering reverse camera..."
            ../render-venv/bin/python scripts/render_bathroom.py \
              --scene build/current/scena_lokalna.json \
              --camera reverse \
              --quality "$QUALITY" \
              --tile-variant "${{ matrix.tile_variant }}" \
              --tile-format "${{ matrix.tile_format }}" \
              --output "$OUT_DIR/reverse"
            cp "$OUT_DIR/reverse"/*.png "$OUT_DIR/${{ matrix.job_id }}_reverse.png" || true
          fi
          
          cp build/render-textures/atlas-${{ matrix.tile_variant }}-120x60.json "$OUT_DIR/tile-texture.json" || true
      - name: Upload rendered views
        uses: actions/upload-artifact@v4
        with:
          name: bathroom-R07-${{ matrix.job_id }}
          path: build/renders/${{ matrix.job_id }}/*.png
          if-no-files-found: error
          retention-days: 14
