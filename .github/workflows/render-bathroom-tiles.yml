name: Porównanie płytek łazienki R07

on:
  push:
    branches: [feat/bathroom-tile-variants, main]
  workflow_dispatch:

concurrency:
  group: bathroom-tile-comparison-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate and test interior model
        run: python scripts/build.py --scope interior --test

  prepare-textures:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache texture ZIP downloads
        uses: actions/cache@v4
        with:
          path: build/render-textures/cache
          key: tile-zips-${{ hashFiles('modules/06_interior/extracts/bathroom-render.yaml') }}
          restore-keys: |
            tile-zips-
      - name: Prepare all tile texture atlases
        run: python scripts/prepare_tile_texture.py --all
      - name: Upload prepared tile texture atlases
        uses: actions/upload-artifact@v4
        with:
          name: bathroom-tile-atlases
          path: |
            build/render-textures/*.jpg
            build/render-textures/*.json
          if-no-files-found: error
          retention-days: 1

  render:
    needs: [test, prepare-textures]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_id: marble-120x60
            tile_variant: opoczno_calacatta_marble
            tile_format: 120x60
          - job_id: marble-120x120
            tile_variant: opoczno_calacatta_marble
            tile_format: 120x120
          - job_id: marble-120x280
            tile_variant: opoczno_calacatta_marble
            tile_format: 120x280
          - job_id: paonazzo-120x60
            tile_variant: opoczno_calacatta_paonazzo
            tile_format: 120x60
          - job_id: monet-120x60
            tile_variant: opoczno_calacatta_monet
            tile_format: 120x60
          - job_id: gold-120x60
            tile_variant: opoczno_calacatta_gold
            tile_format: 120x60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install model dependencies
        run: |
          python -m venv ../model-venv
          ../model-venv/bin/python -m pip install -r requirements.txt
      - name: Build canonical R07 geometry
        run: ../model-venv/bin/python scripts/build.py --scope interior
      - name: Download prepared tile texture atlases
        uses: actions/download-artifact@v4
        with:
          name: bathroom-tile-atlases
          path: build/render-textures/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender/Cycles renderer
        run: |
          python -m venv ../render-venv
          ../render-venv/bin/python -m pip install -r requirements_render.txt
      - name: Render HQ from the canonical bathroom entrance camera
        run: |
          ../render-venv/bin/python scripts/render_bathroom.py \
            --scene build/current/scena_lokalna.json \
            --camera entrance \
            --quality final \
            --tile-variant "${{ matrix.tile_variant }}" \
            --tile-format "${{ matrix.tile_format }}" \
            --output "build/renders/${{ matrix.job_id }}"
          cp build/render-textures/bathroom-tile-atlas.json "build/renders/${{ matrix.job_id }}/tile-texture.json" || true
      - name: Upload HQ PNG, Blender scene and provenance
        uses: actions/upload-artifact@v4
        with:
          name: bathroom-R07-${{ matrix.job_id }}
          path: build/renders/${{ matrix.job_id }}/
          if-no-files-found: error
          retention-days: 14
