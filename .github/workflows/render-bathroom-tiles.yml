name: Porównanie płytek łazienki R07

on:
  push:
    branches: [feat/bathroom-tile-variants, main]
  workflow_dispatch:
    inputs:
      quality:
        description: 'Jakość renderu: preview (szybka ~2 min / kadr) lub final (wysoka HQ 2000x1600 ~20 min / kadr)'
        type: choice
        options: [preview, final]
        default: final
      camera:
        description: 'Ujęcie kamery: both, entrance, reverse'
        type: choice
        options: [both, entrance, reverse]
        default: both

concurrency:
  group: bathroom-tile-comparison-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate and test interior model
        run: python scripts/build.py --scope interior --test

  prepare-textures:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache texture ZIP downloads
        uses: actions/cache@v4
        with:
          path: build/render-textures/cache
          key: tile-zips-${{ hashFiles('modules/06_interior/extracts/bathroom-render.yaml') }}
          restore-keys: |
            tile-zips-
      - name: Prepare all tile texture atlases
        run: python scripts/prepare_tile_texture.py --all
      - name: Upload prepared tile texture atlases
        uses: actions/upload-artifact@v4
        with:
          name: bathroom-tile-atlases
          path: |
            build/render-textures/*.jpg
            build/render-textures/*.json
          if-no-files-found: error
          retention-days: 1

  render:
    needs: [test, prepare-textures]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_id: "01_cersanit_ikarus_white_matt"
            tile_variant: "01_cersanit_ikarus_white_matt"
