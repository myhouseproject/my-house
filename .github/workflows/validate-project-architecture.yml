name: Validate project architecture

on:
  pull_request:
    paths:
      - 'project.yaml'
      - 'AGENTS.md'
      - 'modules/**'
      - 'docs/ARCHITEKTURA_PROJEKTU.md'
      - 'scripts/project.py'
      - '.github/workflows/validate-project-architecture.yml'
  push:
    branches: ['main']
    paths:
      - 'project.yaml'
      - 'AGENTS.md'
      - 'modules/**'
      - 'docs/ARCHITEKTURA_PROJEKTU.md'
      - 'scripts/project.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/project.py validate
      - run: |
          python scripts/project.py plan interior
          python scripts/project.py plan garden
