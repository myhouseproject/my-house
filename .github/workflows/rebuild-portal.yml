name: Build, validate and publish

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned canonical build stack
        run: python -m pip install -r requirements.txt
      - name: Build and test the interior without network services or datum grids
        run: python scripts/build.py --scope interior --test
      - name: Ensure the build did not modify tracked source files
        run: git diff --exit-code

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned canonical build stack
        run: python -m pip install -r requirements.txt
      - name: Prepare and verify pinned datum grids for Google export
        run: python prepare_geodesy.py
      - name: Generate and validate the complete release
        run: python scripts/build.py --scope full --test
      - name: Ensure the build did not modify tracked source files
        run: git diff --exit-code
      - name: Attach the complete release for review
        uses: actions/upload-artifact@v4
        with:
          name: validated-model-${{ github.sha }}
          path: build/current/
          if-no-files-found: error
      - name: Package only public website assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [local-model, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
