name: Rebuild and validate portal

on:
  push:
    branches: ['fix/google-*', 'feature/declarative-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements_portal.txt
      - name: Prepare authoritative vertical datum grids
        run: python prepare_geodesy.py
      - name: Rebuild geometry, garden and portal assets
        run: |
          python scripts/sync_legacy_config.py
          python generuj_geometrie.py
          python buduj_ogrod.py
          python odtworz_portal.py
      - name: Validate coordinates, materials and repeatable generation
        run: |
          python -m unittest discover -s tests -v
          python -m unittest test_context_environment test_scene_downloads -v
          node --test tests/viewer_controller.test.cjs
      - name: Commit validated generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add geoportal_georef.json pzt_zagospodarowanie.json context_geometry_source.json dane_zrodlowe.json obrys_dachu_z_pdf.json okna_projektowe.json stolarka_zewnetrzna.json parametry_modelu.json elewacje_materialy.json wnetrze_projekt.json geoportal_teren.json scena_modelu.json dom_bryla.glb dom_wnetrze.glb dom_Gruszowa60.glb dom_Gruszowa60.kmz google_models google_model_georef.json index.html podglad_3d.html
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild verified Google models and lightweight portal [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
